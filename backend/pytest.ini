# Makes backend/ the pytest rootdir, so `python -m pytest backend/tests` from
# the repository root keeps its cache in backend/.pytest_cache (which pytest
# ignores for git by itself).
[pytest]
testpaths = tests
filterwarnings =
    # Starlette's TestClient nags about httpx; nothing to do on our side.
    ignore:Using `httpx` with `starlette.testclient` is deprecated
